# Local development profile.
# Assumes the PostgreSQL container started by docker-compose at the repository root.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}

  jpa:
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.rescrm: DEBUG
    org.springframework.jdbc.core: INFO

crm:
  security:
    # No default, deliberately. A committed development key is the one that ends up in
    # production, so an unset variable fails loudly the first time an encrypted field is
    # written or read, rather than quietly protecting nothing.
    #
    # Generate one with:
    #   openssl rand -base64 32
    # then export it as CRM_FIELD_ENCRYPTION_KEY before starting the application. Keep the same
    # value between restarts or previously stored identifiers become unreadable.
    field-encryption-key: ${CRM_FIELD_ENCRYPTION_KEY:}
