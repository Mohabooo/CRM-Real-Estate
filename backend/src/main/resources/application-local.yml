# Local development profile.
# Assumes the PostgreSQL container started by docker-compose at the repository root.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}

  jpa:
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.rescrm: DEBUG
    org.springframework.jdbc.core: INFO

crm:
  security:
    # The Vite dev server. It proxies /api to :8080, which rewrites Host but not Origin, so
    # the browser's origin stays :5173 and the origin check would otherwise refuse every
    # sign-in with "This request did not come from an accepted origin".
    #
    # Both spellings, because a browser sent to 127.0.0.1 reports that rather than localhost.
    allowed-origins: ${CRM_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

    # No default, deliberately. A committed development key is the one that ends up in
    # production, so an unset variable fails loudly the first time an encrypted field is
    # written or read, rather than quietly protecting nothing.
    #
    # Generate one with:
    #   openssl rand -base64 32
    # then export it as CRM_FIELD_ENCRYPTION_KEY before starting the application. Keep the same
    # value between restarts or previously stored identifiers become unreadable.
    field-encryption-key: ${CRM_FIELD_ENCRYPTION_KEY:}

    session:
      # Local development runs on http://localhost, where a Secure cookie is never sent back
      # and sign-in appears to succeed and then silently fail on the next request. Off here
      # and only here; the default in application.yml stays true everywhere else.
      cookie-secure: false
