spring:
  application:
    name: crm-backend
  profiles:
    default: local

  mvc:
    # This API serves no static content, so an unmatched path should be reported as a missing
    # handler rather than a missing file. Both settings are Spring Boot defaults today; they
    # are stated because the error envelope's 404 behaviour depends on them.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}
    hikari:
      pool-name: crm-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    open-in-view: false
    # Flyway owns the schema. Hibernate must never alter it: an auto-generated column on a
    # financial table would bypass the constraint review gate described in doc 28, section 5.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Forward-only. Out-of-order application would let two developers' migrations interleave
    # differently in dev and production.
    out-of-order: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are produced by GlobalExceptionHandler in the documented envelope; the container's
    # default error page would emit a second, different shape.
    whitelabel:
      enabled: false
  servlet:
    context-path: /

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.rescrm: INFO
    org.flywaydb: INFO

crm:
  security:
    # Origins allowed to make state-changing requests, beyond this server's own. Empty is
    # correct only when the browser's address bar and this server share an origin.
    #
    # A proxy in front does NOT produce that. The development proxy rewrites Host so the
    # request reaches :8080, but the browser still sends Origin: http://localhost:5173 —
    # different port, different origin. The same applies to any reverse proxy that
    # terminates TLS: the browser's origin is https://app.example.com and the request
    # arrives as http on some internal port.
    #
    # So list the origin the BROWSER uses. The alternative is to trust X-Forwarded-* by
    # setting server.forward-headers-strategy, which makes this server's idea of its own
    # scheme and host depend on headers anything that can reach it may send. Naming the
    # origin is the smaller thing to get right.
    allowed-origins: ${CRM_ALLOWED_ORIGINS:}

    session:
      # A working day. Long enough that an agent is not signed out between viewings, short
      # enough that an unattended desk does not stay open overnight.
      idle-timeout: ${CRM_SESSION_IDLE_TIMEOUT:PT8H}

      # The ceiling, never extended by use. Without it a session kept warm by an attacker
      # would live forever, which is the failure the sliding timeout alone cannot catch.
      absolute-lifetime: ${CRM_SESSION_ABSOLUTE_LIFETIME:P7D}

      # Secure by default; override only for local HTTP development, where a Secure cookie
      # is never sent and sign-in appears to succeed and then silently fail.
      cookie-secure: ${CRM_SESSION_COOKIE_SECURE:true}
      cookie-same-site: ${CRM_SESSION_COOKIE_SAME_SITE:Lax}

app:
  # Placeholder for tenancy configuration consumed from Epic 1 onward.
  tenancy:
    rls-session-variable: app.current_tenant_id
