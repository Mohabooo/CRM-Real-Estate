# Test profile.
# The datasource is supplied at runtime by AbstractPostgresIT, which either starts a
# Testcontainers PostgreSQL or creates a throwaway database on a server named by
# crm.it.db.url. Either way the connection details are decided per run, so nothing here
# is hard-coded: a test that truncates tables should not be one connection string away
# from doing it to real data.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true

logging:
  level:
    root: WARN
    com.rescrm: INFO
    org.testcontainers: INFO

crm:
  security:
    # A fixed, published, test-only AES-256 key. It is safe to commit precisely because it is
    # worthless: it protects nothing but throwaway rows in a database that is destroyed when
    # the run ends. Encrypted-field tests need a deterministic key, and generating one per run
    # would mean a ciphertext written in one test could not be read in the next.
    #
    # Nothing outside the test profile has a default. An unconfigured environment fails loudly
    # on first use rather than falling back to this value.
    field-encryption-key: "dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1leGFjdGx5ISE="

  reservations:
    expiry-sweep:
      # Off in tests. A background sweep expiring fixtures mid-assertion would fail
      # intermittently, and for reasons nobody would find quickly. The integration tests
      # drive ReservationExpirySweep.sweep() directly and control the clock themselves.
      enabled: false
